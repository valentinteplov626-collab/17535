    <script>
    (function() {
             // Конфигурация путей
        const CDN_BASE = 'https://535.igennos.store/17535/girls';
        
        // 1. Берем домен и ID зоны из конфига
        const baseUrl = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG.domain : 'https://jup9.com';
        const zoneId = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG.mainExit_currentTab_zoneId : '10474870';

        // 2. Подготавливаем текущие параметры (например, geo=pk), меняя ? на &
        let currentParams = window.location.search;
        if (currentParams.startsWith('?')) {
            currentParams = '&' + currentParams.substring(1);
        }

        // 3. Собираем итоговую ссылку: домен + /?z=ID_ЗОНЫ + остальные параметры
        const exitUrl = baseUrl + '/?z=' + zoneId + currentParams;

        // Логика ГЕО
        const params = new URLSearchParams(window.location.search);
        const geo = (params.get('geo') || '').toUpperCase().trim();
        const groups = {
            'Arab': ['PK','EG','IQ','SA','AE','KW','QA','OM','BH','JO','LB','SY','YE','MA','DZ','TN','LY'],
            'asian': ['JP','TH','PH','VN','ID','MY','SG','KR','CN','HK','TW'],
            'Africa': ['NG','ZA','KE','GH','TZ','UG','RW','ET','CM','CI']
        };

        let folder = 'Default';
        if (groups.Arab.includes(geo)) folder = 'Arab';
        else if (groups.asian.includes(geo)) folder = 'asian';
        else if (groups.Africa.includes(geo)) folder = 'Africa';

        // Мгновенная подмена картинок
        const updateImages = () => {
            const imgs = document.querySelectorAll('.background-grid img.image');
            if (imgs.length === 0) {
                setTimeout(updateImages, 10);
                return;
            }

            imgs.forEach(img => {
                const num = img.alt.replace('girl', '');
                const fileName = `photo_${num}.webp`;
                const targetSrc = `${CDN_BASE}/${folder}/${fileName}`;
                const fallbackSrc = `${CDN_BASE}/Default/${fileName}`;
                
                img.setAttribute('fetchpriority', 'high');
                
                const temp = new Image();
                temp.onload = () => { img.src = targetSrc; };
                temp.onerror = () => { 
                    if (folder !== 'Default') img.src = fallbackSrc; 
                };
                temp.src = targetSrc;
            });
        };

        updateImages();

        // Обработка кликов (Редирект)
        document.addEventListener('DOMContentLoaded', () => {
            const handleRedirect = () => { window.location.href = exitUrl; };
            
            // Клик по кнопке "Continue"
            const btn = document.querySelector('.continue-btn');
            if (btn) btn.addEventListener('click', handleRedirect);

            // Клик по плитке с фото
            document.querySelectorAll('.image-container').forEach(card => {
                card.addEventListener('click', handleRedirect);
            });
        });
    })();
    </script>
